name: Windows build and release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install CI tooling
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check aqtinstall==3.3.0 clang-format==22.1.8
          $clangFormat = (Get-Command clang-format.exe).Source
          "CLANG_FORMAT=$clangFormat" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Cache native dependencies
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}\workflow-dependencies
          key: workflow-windows-x64-qt-5.15.2-webengine-opencv-4.10.0-ort-1.13.1-v2

      - name: Install native dependencies
        shell: pwsh
        run: ./tool/install.ps1 -Destination "${{ runner.temp }}\workflow-dependencies"

      - name: Configure
        shell: pwsh
        run: cmake --preset windows-msvc

      - name: Check formatting
        shell: pwsh
        run: cmake --build build/project --config Release --target workflow_lint

      - name: Build Release
        shell: pwsh
        run: cmake --build --preset windows-release

      - name: Test Release
        shell: pwsh
        run: ctest --preset windows-release

      - name: Audit Windows 7 imports
        shell: pwsh
        run: >-
          cmake --build build/project --config Release
          --target workflow_win7_audit workflow_test_win7_audit

      - name: Install SDK
        shell: pwsh
        run: cmake --install build/project --config Release --prefix build/sdk-stage

      - name: Install test application
        shell: pwsh
        run: >-
          cmake --install build/project --config Release
          --prefix build/test-stage --component Test

      - name: Verify test application
        shell: pwsh
        run: |
          $requiredFiles = @(
            'workflow-test.exe',
            'README.md',
            'test-page/index.html',
            'models/det.onnx',
            'models/rec.onnx',
            'Qt5WebEngineCore.dll',
            'Qt5WebEngineWidgets.dll',
            'QtWebEngineProcess.exe',
            'resources/icudtl.dat',
            'api-ms-win-core-libraryloader-l1-2-0.dll',
            'api-ms-win-core-processtopology-obsolete-l1-1-0.dll',
            'api-ms-win-eventing-provider-l1-1-0.dll',
            'api-ms-win-core-heap-l2-1-0.dll',
            'api-ms-win-core-shlwapi-legacy-l1-1-0.dll',
            'licenses/Qt-LGPL-GPL-3.0.txt'
          )
          foreach ($relativePath in $requiredFiles) {
            $path = Join-Path "$pwd/build/test-stage" $relativePath
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Test package is missing $relativePath"
            }
          }

      - name: Verify installed package consumer
        shell: pwsh
        run: |
          cmake -S test/consumer -B build/consumer `
            -G "Visual Studio 17 2022" -A x64 -T v142 `
            -Dworkflow_DIR="$pwd/build/sdk-stage/lib/cmake/workflow" `
            -DCMAKE_PREFIX_PATH="$env:WORKFLOW_QT_ROOT;$env:WORKFLOW_OPENCV_DIR"
          cmake --build build/consumer --config Release --parallel 2
          ctest --test-dir build/consumer -C Release --output-on-failure

      - name: Add Debug SDK libraries for tagged releases
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          cmake --build --preset windows-debug
          cmake --install build/project --config Debug --prefix build/sdk-stage

      - name: Create release archives
        id: package
        shell: pwsh
        run: |
          $match = Select-String -Path CMakeLists.txt -Pattern 'project\(workflow VERSION ([0-9.]+)'
          if (-not $match.Matches) { throw 'Project version was not found' }
          $version = $match.Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match project version v$version"
          }
          $packages = ./tool/package.ps1 `
            -SdkDirectory "$pwd/build/sdk-stage" `
            -TestDirectory "$pwd/build/test-stage" `
            -DestinationDirectory "$pwd/build/release" `
            -Version $version
          "sdk_slim_archive=$($packages.SdkSlimArchive)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "sdk_slim_checksum=$($packages.SdkSlimChecksum)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "sdk_slim_name=workflow-sdk-$version-windows-x64-slim" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "sdk_compatible_archive=$($packages.SdkCompatibleArchive)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "sdk_compatible_checksum=$($packages.SdkCompatibleChecksum)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "sdk_compatible_name=workflow-sdk-$version-windows-x64-win7-compatible" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "test_slim_archive=$($packages.TestSlimArchive)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "test_slim_checksum=$($packages.TestSlimChecksum)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "test_slim_name=workflow-test-$version-windows-x64-slim" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "test_compatible_archive=$($packages.TestCompatibleArchive)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "test_compatible_checksum=$($packages.TestCompatibleChecksum)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "test_compatible_name=workflow-test-$version-windows-x64-win7-compatible" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload slim SDK artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.sdk_slim_name }}
          path: |
            ${{ steps.package.outputs.sdk_slim_archive }}
            ${{ steps.package.outputs.sdk_slim_checksum }}
          if-no-files-found: error

      - name: Upload Windows 7 compatible SDK artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.sdk_compatible_name }}
          path: |
            ${{ steps.package.outputs.sdk_compatible_archive }}
            ${{ steps.package.outputs.sdk_compatible_checksum }}
          if-no-files-found: error

      - name: Upload slim test artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.test_slim_name }}
          path: |
            ${{ steps.package.outputs.test_slim_archive }}
            ${{ steps.package.outputs.test_slim_checksum }}
          if-no-files-found: error

      - name: Upload Windows 7 compatible test artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.test_compatible_name }}
          path: |
            ${{ steps.package.outputs.test_compatible_archive }}
            ${{ steps.package.outputs.test_compatible_checksum }}
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME `
              "${{ steps.package.outputs.sdk_slim_archive }}" `
              "${{ steps.package.outputs.sdk_slim_checksum }}" `
              "${{ steps.package.outputs.sdk_compatible_archive }}" `
              "${{ steps.package.outputs.sdk_compatible_checksum }}" `
              "${{ steps.package.outputs.test_slim_archive }}" `
              "${{ steps.package.outputs.test_slim_checksum }}" `
              "${{ steps.package.outputs.test_compatible_archive }}" `
              "${{ steps.package.outputs.test_compatible_checksum }}" `
              --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME `
              "${{ steps.package.outputs.sdk_slim_archive }}" `
              "${{ steps.package.outputs.sdk_slim_checksum }}" `
              "${{ steps.package.outputs.sdk_compatible_archive }}" `
              "${{ steps.package.outputs.sdk_compatible_checksum }}" `
              "${{ steps.package.outputs.test_slim_archive }}" `
              "${{ steps.package.outputs.test_slim_checksum }}" `
              "${{ steps.package.outputs.test_compatible_archive }}" `
              "${{ steps.package.outputs.test_compatible_checksum }}" `
              --generate-notes --verify-tag
          }
